<section class="trace-story" aria-labelledby="trace-story-title">
  <div class="flow-board" aria-label="Diagrama de trazabilidad de iVentas y Venta Nueva">
    <svg
      class="flow-board__connectors"
      viewBox="0 0 1200 700"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="ribbon-orange" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f0522d" stop-opacity="0.68"></stop>
          <stop offset="100%" stop-color="#ff9b79" stop-opacity="0.72"></stop>
        </linearGradient>
        <linearGradient id="ribbon-gray" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#6b819d" stop-opacity="0.66"></stop>
          <stop offset="100%" stop-color="#a7b6c8" stop-opacity="0.74"></stop>
        </linearGradient>
      </defs>

      <g class="flow-ribbons">
        <path
          *ngFor="let ribbon of flowRibbons"
          class="flow-ribbon"
          [class.flow-ribbon--gray]="ribbon.tone === 'gray'"
          [attr.d]="ribbon.d"
          [attr.fill-opacity]="ribbon.opacity"
        ></path>
      </g>
    </svg>

    <button *ngIf="leadsNode as node" type="button" class="flow-card flow-card--leads" (click)="openNode(node)">
      <mat-icon>{{ node.icon }}</mat-icon>
      <span class="flow-card__label">{{ node.label }}</span>
      <strong>{{ node.value }}</strong>
      <small>{{ node.support }}</small>
      <span class="flow-card__action">Ver filas <mat-icon>open_in_new</mat-icon></span>
    </button>

    <article *ngIf="visitsNode as node" class="flow-card flow-card--visits">
      <button type="button" class="flow-card__visit-top" (click)="openNode(node)">
        <mat-icon class="flow-card__visit-main-icon">smartphone</mat-icon>
        <span class="flow-card__label">{{ node.label }}</span>
        <strong>{{ node.value }}</strong>
      </button>

      <span class="flow-card__visit-split">
        <button
          type="button"
          class="flow-card__visit-result flow-card__visit-result--not-bought"
          (click)="openMetric('visits_iventas_not_bought')"
        >
          <mat-icon>shopping_cart</mat-icon>
          <small>No compraron</small>
          <strong>{{ formatInteger(summary?.visits_iventas_not_bought || 0) }}</strong>
          <span class="flow-card__visit-action">Ver filas <mat-icon>open_in_new</mat-icon></span>
        </button>

        <button
          type="button"
          class="flow-card__visit-result flow-card__visit-result--bought"
          (click)="openMetric('visits_iventas_bought')"
        >
          <mat-icon>shopping_cart</mat-icon>
          <small>Compraron</small>
          <strong>{{ formatInteger(summary?.visits_iventas_bought || 0) }}</strong>
          <span class="flow-card__visit-action">Ver filas <mat-icon>open_in_new</mat-icon></span>
        </button>
      </span>
    </article>

    <button *ngIf="salesTotalNode as node" type="button" class="flow-card flow-card--sales-total flow-card--emphasis" (click)="openNode(node)">
      <mat-icon>{{ node.icon }}</mat-icon>
      <span class="flow-card__label">{{ node.label }}</span>
      <strong>{{ node.value }}</strong>
      <small>{{ node.support }}</small>
      <span class="flow-card__action">Ver filas <mat-icon>open_in_new</mat-icon></span>
    </button>

    <button *ngIf="salesIventasNode as node" type="button" class="flow-card flow-card--junction flow-card--emphasis" (click)="openNode(node)">
      <mat-icon>{{ node.icon }}</mat-icon>
      <span class="flow-card__label">{{ node.label }}</span>
      <strong>{{ node.value }}</strong>
      <small>{{ node.support }}</small>
      <span class="flow-card__action">Ver filas <mat-icon>open_in_new</mat-icon></span>
    </button>

    <button *ngIf="publicationNode as node" type="button" class="flow-card flow-card--publications" (click)="openNode(node)">
      <mat-icon>{{ node.icon }}</mat-icon>
      <span class="flow-card__label">{{ node.label }}</span>
      <strong>{{ node.value }}</strong>
      <small>{{ node.support }}</small>
      <span class="flow-card__action">Ver filas <mat-icon>open_in_new</mat-icon></span>
    </button>

    <button *ngIf="organicNode as node" type="button" class="flow-card flow-card--organic" (click)="openNode(node)">
      <mat-icon>{{ node.icon }}</mat-icon>
      <span class="flow-card__label">{{ node.label }}</span>
      <strong>{{ node.value }}</strong>
      <small>{{ node.support }}</small>
      <span class="flow-card__action">Ver filas <mat-icon>open_in_new</mat-icon></span>
    </button>

    <article *ngIf="untracedVisitsNode as node" class="flow-card flow-card--untraced-visits">
      <button type="button" class="flow-card__visit-top" (click)="openNode(node)">
        <mat-icon class="flow-card__visit-main-icon">link_off</mat-icon>
        <span class="flow-card__label">{{ node.label }}</span>
        <strong>{{ node.value }}</strong>
      </button>

      <span class="flow-card__visit-split">
        <button
          type="button"
          class="flow-card__visit-result flow-card__visit-result--not-bought"
          (click)="openMetric('visits_not_iventas_not_bought')"
        >
          <mat-icon>shopping_cart</mat-icon>
          <small>No compraron</small>
          <strong>{{ formatInteger(summary?.visits_not_iventas_not_bought || 0) }}</strong>
          <span class="flow-card__visit-action">Ver filas <mat-icon>open_in_new</mat-icon></span>
        </button>

        <button
          type="button"
          class="flow-card__visit-result flow-card__visit-result--bought"
          (click)="openMetric('visits_not_iventas_bought')"
        >
          <mat-icon>shopping_cart</mat-icon>
          <small>Compraron</small>
          <strong>{{ formatInteger(summary?.visits_not_iventas_bought || 0) }}</strong>
          <span class="flow-card__visit-action">Ver filas <mat-icon>open_in_new</mat-icon></span>
        </button>
      </span>
    </article>

    <button *ngIf="fallbackNode as node" type="button" class="flow-card flow-card--fallback" (click)="openNode(node)">
      <mat-icon>{{ node.icon }}</mat-icon>
      <span class="flow-card__label">{{ node.label }}</span>
      <strong>{{ node.value }}</strong>
      <small>{{ node.support }}</small>
      <span class="flow-card__action">Ver filas <mat-icon>open_in_new</mat-icon></span>
    </button>

    <section class="flow-origin-stack" aria-labelledby="flow-origin-stack-title">
      <div class="flow-origin-stack__heading">
        <div>
          <p>Ventas sin match iVentas</p>
          <h3 id="flow-origin-stack-title">Origen de ventas</h3>
        </div>
        <span>Encuesta Venta Total</span>
      </div>

      <p *ngIf="!fallbackOrigins.length" class="flow-origin-stack__empty">
        No hay ventas clasificadas para el periodo.
      </p>

      <div *ngIf="fallbackOrigins.length" class="flow-origin-stack__list">
        <button
          *ngFor="let row of fallbackOrigins"
          type="button"
          class="flow-origin-card"
          (click)="openOrigin(row)"
        >
          <span class="flow-origin-card__icon"><mat-icon>{{ row.icon }}</mat-icon></span>
          <span class="flow-origin-card__copy">
            <strong>{{ row.displayLabel }}</strong>
            <small>Ver filas <mat-icon>open_in_new</mat-icon></small>
          </span>
          <span class="flow-origin-card__value">{{ row.salesDisplay }}</span>
          <span class="flow-origin-card__share">{{ row.shareDisplay }}</span>
        </button>
      </div>
    </section>
  </div>
</section>
