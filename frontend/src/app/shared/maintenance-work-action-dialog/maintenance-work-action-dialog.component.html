<section class="maintenance-work-dialog">
  <header mat-dialog-title class="maintenance-work-dialog__header">
    <mat-icon>{{ iconName }}</mat-icon>
    <div>
      <h2>{{ title }}</h2>
      <small>Ticket #{{ data.ticketId }}</small>
    </div>
  </header>

  <mat-dialog-content class="maintenance-work-dialog__content">
    <p>{{ description }}</p>
    <mat-form-field appearance="fill" class="maintenance-work-dialog__field">
      <mat-label>{{ fieldLabel }}</mat-label>
      <textarea
        matInput
        rows="5"
        [maxlength]="maxLength"
        [(ngModel)]="notes"
        [placeholder]="fieldPlaceholder"
      ></textarea>
      <mat-hint align="end">{{ notes.length }} / {{ maxLength }}</mat-hint>
    </mat-form-field>
    <small *ngIf="isCompletion" class="maintenance-work-dialog__hint">
      El técnico no registra costos ni solicita el cierre. La coordinación revisará el trabajo.
    </small>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="maintenance-work-dialog__actions">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button type="button" color="primary" [disabled]="!canSubmit" (click)="save()">
      {{ submitLabel }}
    </button>
  </mat-dialog-actions>
</section>
