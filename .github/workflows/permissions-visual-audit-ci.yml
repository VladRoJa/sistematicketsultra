name: Permissions visual audit — read-only matrix

on:
  pull_request:
    paths:
      - "backend/app/routes/permissions_visual_audit_routes.py"
      - "backend/scripts/audit_permission_endpoints.py"
      - "backend/app/routes/permissions_catalog_routes.py"
      - "backend/app/routes/permissions_b5_beta_routes.py"
      - "backend/tests/routes/test_permissions_phase_b_b5_scoped_beta.py"
      - "docs/security/permissions_phase_b_b5_scoped_beta_20261028.md"
      - "backend/tests/routes/test_permissions_phase_b_b1_nube_compare_only.py"
      - "backend/tests/routes/test_permissions_phase_a_p34_closure.py"
      - "backend/tests/utils/test_permissions_phase_a_document_object_parity.py"
      - "docs/security/permissions_phase_b_b1_nube_compare_only_20261027.md"
      - "backend/app/__init__.py"
      - "backend/tests/routes/test_permissions_visual_audit_matrix.py"
      - "backend/tests/routes/test_permissions_legacy_coverage_inventory_pm_tickets.py"
      - "backend/tests/routes/test_permissions_action_alias_contract.py"
      - "frontend/src/app/permissions-observability/**"
      - "docs/security/permissions_visual_audit_milestone_20261023.md"
      - "docs/security/permissions_legacy_coverage_inventory_pm_tickets_20261023.md"
      - "docs/security/permissions_action_aliases_20261023.md"
      - ".github/workflows/permissions-visual-audit-ci.yml"

permissions:
  contents: read

jobs:
  backend-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: permissions-visual-audit-ci
      JWT_SECRET_KEY: permissions-visual-audit-ci
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile audit backend
        run: |
          python -m py_compile app/routes/permissions_visual_audit_routes.py
          python -m py_compile app/routes/permissions_b5_beta_routes.py
      - name: Run new audit and phase A parity suites
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/routes/test_permissions_visual_audit_matrix.py \
            tests/routes/test_permissions_legacy_coverage_inventory_pm_tickets.py \
            tests/routes/test_permissions_action_alias_contract.py \
            tests/routes/test_permissions_phase_a_bidirectional_projection.py \
            tests/routes/test_permissions_phase_a_bidirectional_classification.py \
            tests/routes/test_permissions_phase_a_p34_closure.py \
            tests/utils/test_permissions_phase_a_document_object_parity.py \
            tests/routes/test_permissions_phase_b_b1_nube_compare_only.py \
            tests/routes/test_permissions_phase_b_b3_module_grants_safety.py \
            tests/routes/test_permissions_phase_b_b5_scoped_beta.py \
            tests/routes/test_internal_documents_a12_a13_http_jwt_reconcile.py \
            tests/routes/test_permissions_phase_a_track_parity.py \
            tests/routes/test_permissions_phase_a_inventory_parity.py

      - name: Inventory all Flask endpoints against high-risk catalog (read-only)
        run: python scripts/audit_permission_endpoints.py --output-dir ../permissions-audit-output
      - name: Upload endpoint inventory
        uses: actions/upload-artifact@v4
        with:
          name: permissions-endpoint-inventory
          path: permissions-audit-output/
          if-no-files-found: error

  angular-build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Angular dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build -- --configuration production
