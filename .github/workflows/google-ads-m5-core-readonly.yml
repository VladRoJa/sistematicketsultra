name: Google Ads M5 Core Readonly

on:
  pull_request:
    paths:
      - 'backend/app/services/marketing_google_ads_branch_attribution_service.py'
      - 'backend/tests/google_ads/**'
      - '.github/workflows/google-ads-m5-core-readonly.yml'
  push:
    branches:
      - feat/google-ads-m5-core-readonly-20261013

permissions:
  contents: read

jobs:
  scoped-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: google_ads_m5_ci
          POSTGRES_PASSWORD: isolated_google_ads_m5
          POSTGRES_DB: google_ads_m5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U google_ads_m5_ci -d google_ads_m5_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: M5 read-only scope and Funnel regression
        working-directory: backend
        env:
          SECRET_KEY: google-ads-m5-core-ci
          JWT_SECRET_KEY: google-ads-m5-core-ci-jwt
          GOOGLE_ADS_M5_TEST_POSTGRES_URL: postgresql+psycopg2://google_ads_m5_ci:isolated_google_ads_m5@127.0.0.1:5432/google_ads_m5_test
        run: |
          python -m pytest -q --tb=short \
            tests/google_ads \
            tests/marketing/test_google_ads_funnel_investment.py
