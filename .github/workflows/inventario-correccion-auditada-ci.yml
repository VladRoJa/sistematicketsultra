name: Inventario QA-13 Correcciones Auditadas CI

on:
  pull_request:
    paths:
      - "backend/app/routes/inventarios.py"
      - "backend/app/models/inventario_codigo_correccion.py"
      - "backend/app/models/__init__.py"
      - "backend/migrations/versions/i22c10202622_inventario_codigo_correcciones.py"
      - "backend/tests/routes/test_inventario_correccion_codigo_auditada_qa13.py"
      - "backend/tests/routes/test_inventario_existencias_codigo_qa.py"
      - "frontend/src/app/inventario/**"
      - "frontend/src/app/services/inventario.service.ts"
      - "frontend/tests/inventario-correccion-auditada-qa13.test.cjs"
      - ".github/workflows/inventario-correccion-auditada-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: qa13-only
      JWT_SECRET_KEY: qa13-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Python syntax
        run: python -m py_compile app/routes/inventarios.py app/models/inventario_codigo_correccion.py migrations/versions/i22c10202622_inventario_codigo_correcciones.py
      - name: QA-13 Correcciones y E1 contrato lectura de Existencias
        run: python -m pytest -q --tb=short -o addopts= tests/routes/test_inventario_correccion_codigo_auditada_qa13.py tests/routes/test_inventario_altas_codigos_qa11.py tests/routes/test_inventario_existencias_codigo_qa.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: QA-13 Dialog audit trail
        run: node --test tests/inventario-correccion-auditada-qa13.test.cjs
      - name: QA-12 Duplicate codes and filters
        run: node --test tests/inventario-auditoria-codigos.test.cjs tests/inventario-filtros-qa09.test.cjs
      - name: Angular typecheck
        run: npx tsc --noEmit --project tsconfig.app.json
      - name: Angular production build
        run: npm run build -- --configuration production
