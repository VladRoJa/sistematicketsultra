name: Tickets Tapizado M2 - API and Alembic

on:
  pull_request:
    paths:
      - "backend/app/config.py"
      - "backend/app/models/ticket_model.py"
      - "backend/app/models/ticket_aparato.py"
      - "backend/app/routes/ticket_routes.py"
      - "backend/app/services/ticket_tapizado_service.py"
      - "backend/migrations/versions/l23c10202623_ticket_tipo_trabajo_tapizado.py"
      - "backend/tests/models/test_ticket_tapizado_m2_migration.py"
      - "backend/tests/routes/test_ticket_tapizado_m2.py"
      - ".github/workflows/tickets-tapizado-m2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tapizado-m2:
    name: tapizado-m2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: tickets-tapizado-m2-ci-only
      JWT_SECRET_KEY: tickets-tapizado-m2-ci-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked backend dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile affected files
        run: |
          python -m py_compile app/config.py app/models/ticket_model.py app/models/ticket_aparato.py app/routes/ticket_routes.py app/services/ticket_tapizado_service.py migrations/versions/l23c10202623_ticket_tipo_trabajo_tapizado.py
      - name: Tapizado M2 API, DB model, migration and mandatory-equipment regressions
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/routes/test_ticket_tapizado_m2.py \
            tests/models/test_ticket_tapizado_m2_migration.py \
            tests/routes/test_create_ticket_requires_apparatus.py \
            tests/models/test_ticket_aparatos_m1_schema.py
