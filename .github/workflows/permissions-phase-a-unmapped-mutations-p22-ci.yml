name: Phase A P22 Permission Route Diagnostic
on:
  pull_request:
    paths:
      - 'backend/tests/routes/test_permissions_phase_a_unmapped_mutations_p22.py'
      - '.github/workflows/permissions-phase-a-unmapped-mutations-p22-ci.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SECRET_KEY: permissions-phase-a-test-only
      JWT_SECRET_KEY: permissions-phase-a-test-only
      SQLALCHEMY_DATABASE_URI: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Run P21 and P22 inventory tests
        run: |
          python -m pytest -s -q --tb=short -o addopts= tests/routes/test_permissions_phase_a_route_coverage.py tests/routes/test_permissions_phase_a_unmapped_mutations_p22.py
