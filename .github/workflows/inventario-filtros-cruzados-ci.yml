name: Inventario Filtros Cruzados CI

on:
  pull_request:
    paths:
      - "frontend/src/app/inventario/inventario.component.ts"
      - "frontend/src/app/inventario/inventario.component.html"
      - "frontend/src/app/utils/tabla-filtros.helper.ts"
      - "frontend/tests/inventario-filtros-qa09.test.cjs"
      - ".github/workflows/inventario-filtros-cruzados-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: QA Inventario - filtros cruzados
        run: node --test tests/inventario-filtros-qa09.test.cjs
      - name: Type-check Angular
        run: npx tsc --noEmit --project tsconfig.app.json
      - name: Production build
        run: npm run build -- --configuration production
