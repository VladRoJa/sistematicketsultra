# Diagnóstico histórico aislado. Seguimiento: https://github.com/VladRoJa/sistematicketsultra/issues/945
# No es requisito de merge para Tickets; ejecutar manualmente al investigar Track.
name: Track Alembic Bootstrap Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alembic-from-empty-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: suite_ultra_tickets_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d suite_ultra_tickets_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend requirements
        run: |
          python -m pip install -r backend/requirements.txt
      - name: Diagnostic - apply entire Alembic history to an empty PostgreSQL QA database
        working-directory: backend
        env:
          APP_ENV: local
          FLASK_APP: app:create_app
          SECRET_KEY: tickets-v1-alembic-ci
          JWT_SECRET_KEY: tickets-v1-alembic-jwt-ci
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/suite_ultra_tickets_qa
        run: |
          python -m flask db upgrade
          python -m flask db current
