name: CAP-V1 Playwright Training QA

on:
  pull_request:
    paths:
      - 'scripts/training/**'
      - 'docs/capacitacion/**'
      - '.github/workflows/cap-v1-training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  training-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencia mínima
        run: python -m pip install playwright==1.54.0
      - name: QA sin credenciales ni servidor Suite
        run: python -m unittest discover -s scripts/training/tests -v
