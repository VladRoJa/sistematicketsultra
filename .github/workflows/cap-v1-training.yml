name: CAP-V1 Playwright Training QA

on:
  pull_request:
    paths:
      - 'scripts/training/**'
      - 'backend/scripts/seed_training_tapizado_qa.py'
      - 'docs/capacitacion/**'
      - '.github/workflows/cap-v1-training.yml'
      - '.github/workflows/cap-v1-prod-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  training-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg, FFprobe y narrador offline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version | head -1
          ffprobe -version | head -1
          espeak-ng --version
      - name: Instalar dependencia mínima
        run: python -m pip install playwright==1.54.0 SQLAlchemy==2.0.40
      - name: Compilar scripts de capacitación
        run: python -m compileall -q scripts/training backend/scripts/seed_training_tapizado_qa.py
      - name: QA obligatorio de MP4, audio y subtítulos sin Suite
        run: python -m unittest discover -s scripts/training/tests -v
