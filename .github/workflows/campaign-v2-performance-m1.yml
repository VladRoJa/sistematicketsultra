name: Campaign V2 Performance M1 CI

on:
  pull_request:
    paths:
      - "backend/app/services/marketing_campaign_v2_performance_service.py"
      - "backend/app/routes/marketing_campaign_v2_routes.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_performance_service.py"
      - "frontend/src/app/marketing-campaign-v2/**"
      - ".github/workflows/campaign-v2-performance-m1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: synthetic-m1-ci
      JWT_SECRET_KEY: synthetic-m1-jwt-ci
      CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt pytest==8.3.5
      - name: Compile and run M1 focused + existing reporting tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app/services/marketing_campaign_v2_performance_service.py app/routes/marketing_campaign_v2_routes.py
          python -m pytest -q --tb=short \
            tests/marketing/test_marketing_campaign_v2_performance_service.py \
            tests/marketing/test_marketing_campaign_v2_consolidated_reporting_service.py

  frontend-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Angular production build
        working-directory: frontend
        run: npm run build
