name: Fase A — Bidirectional Permission Consistency Diagnostics

on:
  pull_request:
    paths:
      - "backend/tests/routes/test_permissions_phase_a_bidirectional_projection.py"
      - "backend/tests/routes/test_permissions_phase_a_bidirectional_classification.py"
      - ".github/workflows/permissions-phase-a-bidirectional-parity-ci.yml"

permissions:
  contents: read

jobs:
  bidirectional-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: permissions-phase-a-test-only
      JWT_SECRET_KEY: permissions-phase-a-test-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Verify shared projection invariants and classify preview gaps
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/routes/test_permissions_phase_a_bidirectional_projection.py \
            tests/routes/test_permissions_phase_a_bidirectional_classification.py
