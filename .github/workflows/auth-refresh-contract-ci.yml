name: Auth Refresh Contract CI

on:
  pull_request:
    paths:
      - "backend/app/__init__.py"
      - "backend/app/config.py"
      - "backend/app/models/auth_refresh_session.py"
      - "backend/app/models/__init__.py"
      - "backend/app/routes/auth_routes.py"
      - "backend/app/services/auth_refresh_service.py"
      - "backend/migrations/versions/a21c10202621_auth_refresh_sessions.py"
      - "backend/tests/auth/**"
      - ".github/workflows/auth-refresh-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: synthetic-refresh-ci-only
      JWT_SECRET_KEY: synthetic-jwt-refresh-ci-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      AUTH_REFRESH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile auth and Alembic changes
        run: |
          python -m py_compile \
            app/__init__.py \
            app/config.py \
            app/models/auth_refresh_session.py \
            app/routes/auth_routes.py \
            app/services/auth_refresh_service.py \
            migrations/versions/a21c10202621_auth_refresh_sessions.py \
            tests/auth/test_refresh_cookie_contract.py
      - name: Run isolated auth session tests
        run: python -m pytest -q --tb=short -o addopts= tests/auth/test_refresh_cookie_contract.py
