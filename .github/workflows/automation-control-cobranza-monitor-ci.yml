name: Automation Control Cobranza Monitor CI

on:
  pull_request:
    paths:
      - 'backend/app/services/automation_control/cobranza_multibranch_observation_service.py'
      - 'backend/app/services/automation_control/job_catalog.py'
      - 'backend/app/services/automation_control/job_read_service.py'
      - 'backend/app/services/automation_control/diagnostic_service.py'
      - 'backend/app/services/automation_control/timeline_service.py'
      - 'backend/app/warehouse/jobs/cobranza_iventas_multibranch.py'
      - 'backend/app/warehouse/scheduler/reports_scheduler_worker.py'
      - 'backend/tests/automation_control/**'
      - 'frontend/src/app/automation-control/**'
      - '.github/workflows/automation-control-cobranza-monitor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install -r backend/requirements.txt pytest
      - name: Compile observation and scheduler
        run: |
          python -m py_compile backend/app/services/automation_control/cobranza_multibranch_observation_service.py backend/app/services/automation_control/job_catalog.py backend/app/services/automation_control/job_read_service.py backend/app/services/automation_control/diagnostic_service.py backend/app/services/automation_control/timeline_service.py backend/app/warehouse/scheduler/reports_scheduler_worker.py
      - name: Targeted monitoring and cobranza regression tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/automation_control/test_cobranza_multibranch_observation.py tests/automation_control/test_job_catalog.py tests/automation_control/test_read_api.py tests/automation_control/test_effective_schedule.py tests/automation_control/test_timeline.py tests/automation_control/test_all_workers_batch.py tests/automation_control/test_reports_cobranza_recurrente.py tests/warehouse/test_cobranza_iventas_multibranch.py
  frontend-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Angular deps
        working-directory: frontend
        run: npm ci
      - name: Angular production build
        working-directory: frontend
        run: npm run build
