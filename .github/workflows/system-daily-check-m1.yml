name: System Daily Check M1

on:
  pull_request:
    paths:
      - "backend/app/models/system_daily_check.py"
      - "backend/app/models/__init__.py"
      - "backend/app/utils/system_daily_check_access.py"
      - "backend/app/services/system_daily_check_service.py"
      - "backend/app/routes/system_daily_check_routes.py"
      - "backend/app/__init__.py"
      - "backend/migrations/versions/c1d5e9a7b204_add_system_daily_check_m1.py"
      - "backend/tests/system_daily_check/**"
      - ".github/workflows/system-daily-check-m1.yml"
  push:
    branches:
      - "feat/checklist-sistemas-v1-m1"

permissions:
  contents: read

jobs:
  checklist-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest==8.3.5"
      - name: Run System Daily Check M1 tests
        working-directory: backend
        env:
          SECRET_KEY: isolated-system-daily-check-secret
          JWT_SECRET_KEY: isolated-system-daily-check-jwt
        run: |
          python -m pytest -q --tb=short tests/system_daily_check
