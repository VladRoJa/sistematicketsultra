name: Google Ads Funnel M2

on:
  pull_request:
    paths:
      - 'backend/app/services/marketing_google_ads_funnel_service.py'
      - 'backend/app/services/marketing_sales_funnel_cutoff_service.py'
      - 'backend/tests/marketing/test_google_ads_funnel_investment.py'
      - 'frontend/src/app/marketing-sales-funnel/**'
      - '.github/workflows/google-ads-funnel-m2.yml'
  push:
    branches:
      - feat/google-ads-funnel-visibility-m2-20261012

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: Run Google Ads Funnel and cutoff tests
        working-directory: backend
        env:
          SECRET_KEY: google-ads-funnel-ci
          JWT_SECRET_KEY: google-ads-funnel-jwt-ci
        run: |
          python -m pytest -q --tb=short             tests/marketing/test_google_ads_funnel_investment.py             tests/marketing/test_marketing_sales_funnel_cutoff_service.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript
        working-directory: frontend
        run: node node_modules/typescript/bin/tsc --noEmit --project tsconfig.app.json
