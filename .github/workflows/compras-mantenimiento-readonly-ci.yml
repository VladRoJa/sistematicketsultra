name: Compras Mantenimiento Readonly

on:
  pull_request:
    paths:
      - "backend/app/utils/pm_permissions.py"
      - "backend/app/utils/ticket_filters.py"
      - "backend/app/utils/maintenance_ticket_update_guard.py"
      - "backend/app/routes/pm_routes.py"
      - "backend/app/routes/ticket_routes.py"
      - "backend/app/maintenance_planner/**"
      - "backend/tests/utils/test_compras_maintenance_read_access.py"
      - "backend/tests/utils/test_maintenance_ticket_update_guard.py"
      - "backend/tests/maintenance_planner/**"
      - "frontend/src/app/layout/layout.component.ts"
      - ".github/workflows/compras-mantenimiento-readonly-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend requirements
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest==8.3.5"
      - name: Compile affected backend modules
        run: |
          python -m py_compile \
            backend/app/utils/pm_permissions.py \
            backend/app/utils/ticket_filters.py \
            backend/app/utils/maintenance_ticket_update_guard.py \
            backend/app/routes/pm_routes.py \
            backend/app/routes/ticket_routes.py \
            backend/app/maintenance_planner/service.py \
            backend/app/maintenance_planner/routes.py
      - name: Scoped-read and Planner regressions
        working-directory: backend
        env:
          SECRET_KEY: compras-maint-ci
          JWT_SECRET_KEY: compras-maint-jwt-ci
        run: |
          python -m pytest -q --tb=short \
            tests/utils/test_compras_maintenance_read_access.py \
            tests/utils/test_maintenance_ticket_update_guard.py \
            tests/maintenance_planner/test_service.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Compile Angular app
        working-directory: frontend
        run: node node_modules/typescript/bin/tsc --noEmit --project tsconfig.app.json
