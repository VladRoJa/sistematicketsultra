name: Campaign V2 Profitability M2 Core CI

on:
  pull_request:
    paths:
      - "backend/app/services/marketing_campaign_v2_unique_sales_service.py"
      - "backend/app/services/marketing_campaign_v2_sales_month_source_service.py"
      - "backend/scripts/campaign_v2_m2_sales_month_readonly.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_unique_sales_service.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_sales_month_source_service.py"
      - ".github/workflows/campaign-v2-profitability-m2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unique-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: synthetic-m2-core-ci
      JWT_SECRET_KEY: synthetic-m2-core-jwt-ci
      CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt pytest==8.3.5
      - name: Compile and test unique M2 allocation and existing commercial reconciliation
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app/services/marketing_campaign_v2_unique_sales_service.py app/services/marketing_campaign_v2_sales_month_source_service.py scripts/campaign_v2_m2_sales_month_readonly.py
          python -m pytest -q --tb=short \
            tests/marketing/test_marketing_campaign_v2_unique_sales_service.py \
            tests/marketing/test_marketing_campaign_v2_sales_month_source_service.py \
            tests/marketing/test_marketing_campaign_v2_commercial_materialization_service.py
