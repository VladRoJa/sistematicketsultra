name: Tickets V1 Maintenance Coordination

on:
  pull_request:
    paths:
      - "backend/app/utils/tickets_maintenance_permissions.py"
      - "backend/app/models/ticket_model.py"
      - "backend/app/routes/ticket_routes.py"
      - "backend/app/services/ticket_maintenance_coordination_service.py"
      - "backend/tests/utils/test_tickets_maintenance_permissions.py"
      - "backend/tests/services/test_ticket_maintenance_coordination_service.py"
      - "backend/migrations/versions/c17a10202601_tickets_v1_maintenance_attention.py"
      - ".github/workflows/tickets-v1-maintenance-coordination-ci.yml"

permissions:
  contents: read

jobs:
  coordinator-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend requirements
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest==8.3.5"
      - name: Compile authorization module
        run: |
          python -m py_compile backend/app/utils/tickets_maintenance_permissions.py \
            backend/app/models/ticket_model.py \
            backend/app/services/ticket_maintenance_coordination_service.py \
            backend/app/routes/ticket_routes.py \
            backend/migrations/versions/c17a10202601_tickets_v1_maintenance_attention.py
      - name: Run authorization unit tests
        working-directory: backend
        env:
          SECRET_KEY: tickets-v1-maint-ci
          JWT_SECRET_KEY: tickets-v1-maint-jwt-ci
        run: |
          python -m pytest -q --tb=short tests/utils/test_tickets_maintenance_permissions.py \
            tests/services/test_ticket_maintenance_coordination_service.py
      - name: Inspect Alembic migration heads (read-only)
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config()
          cfg.set_main_option("script_location", "backend/migrations")
          heads = ScriptDirectory.from_config(cfg).get_heads()
          print("ALEMBIC_HEADS =", heads)
          assert heads == ["c17a10202601"], heads
          PY
