      - "backend/app/utils/contact_center_access.py"
      - "backend/app/utils/system_daily_check_access.py"
      - "backend/app/services/contact_center*.py"
      - "backend/app/services/purchase_requisition*.py"
      - "backend/app/services/system_daily_check*.py"
      - "backend/tests/routes/test_permissions_phase_a_cross_family_p27.py"
      - "backend/tests/routes/test_permissions_phase_a_p28_snapshot_contract.py"
      - "backend/tests/routes/test_permissions_phase_a_p29_action_reconciliation.py"
      - "backend/tests/routes/test_permissions_phase_a_p30_live_action_parity.py"
      - "backend/tests/routes/test_permissions_phase_a_p31_effective_guard_parity.py"
      - "backend/tests/routes/test_permissions_phase_a_p32_capability_groups.py"
      - "docs/security/permissions_phase_a_p32_102_capability_contract_20261027.csv"
      - "docs/security/permissions_phase_a_p32_capability_audit_20261027.md"
      - "backend/app/routes/marketing_campaign_v2_routes.py"
      - "backend/app/routes/google_ads_m6_continuity_routes.py"
      - "backend/app/routes/google_ads_oauth_routes.py"
      - "backend/services/marketing_access.py"
      - "backend/app/utils/purchase_requisition_permissions.py"
      - "docs/security/permissions_phase_a_p31_effective_guard_parity_20261027.md"
      - "docs/security/permissions_phase_a_p31_effective_guards_20261027.csv"
      - "backend/app/routes/permissions_catalog_routes.py"
      - "backend/app/routes/openings_routes.py"
      - "backend/app/routes/openings_lifecycle_routes.py"
      - "backend/app/routes/inventarios.py"
      - "backend/app/routes/ticket_routes.py"
      - "backend/app/services/ticket_tapizado_recepcion_service.py"
      - "backend/app/utils/permission_live_action_snapshot.py"
      - "backend/app/utils/tickets_maintenance_permissions.py"
      - "backend/app/services/ticket_maintenance_coordination_service.py"
      - "docs/security/permissions_phase_a_p30_live_catalog_20261026.md"
      - "docs/security/permissions_phase_a_p30_live_action_reconciliation_20261026.csv"
      - "backend/app/track_alerts/routes/track_alert_routes.py"
      - "backend/app/routes/warehouse_internal_jobs.py"
      - "backend/tests/test_track_alert_routes_p29_auth.py"
      - "backend/tests/test_track_alert_routes.py"
      - "docs/security/permissions_phase_a_p29_action_reconciliation_20261026.csv"
      - "docs/security/permissions_phase_a_p29_action_parity_20261026.md"
      - "backend/migrations/versions/3d4f6a8b9c10_seed_global_permissions_catalog.py"
      - "backend/migrations/versions/7b8c9d0e1f2a_seed_permission_route_map_high_risk.py"
      - "backend/migrations/versions/8f1e2d3c4b5a_add_permission_module_assignable_metadata.py"
      - "docs/security/permissions_phase_a_p28_live_mutations_20261026.csv"
      - "docs/security/permissions_phase_a_p28_live_gaps_20261026.md"
      - "backend/app/routes/**"
      - "backend/tests/contact_center/test_contact_center_access.py"
      - "backend/tests/contact_center/test_contact_center_manager_scope_contract.py"
      - "backend/tests/purchase_requisitions/test_permissions_phase_a_finance_approval_p23.py"
      - "backend/tests/purchase_requisitions/test_permissions_phase_a_finance_rejection_p24.py"
      - "backend/tests/system_daily_check/test_system_daily_check_access.py"
      - "backend/tests/automation_control/test_read_api.py"
      - "docs/security/permissions_phase_a_p27_cross_family_20261026.md"
      - "backend/tests/routes/test_permissions_phase_a_live_map_reconcile_p25.py"
      - "backend/tests/routes/test_permissions_phase_a_route_coverage.py"
      - "backend/tests/routes/test_permissions_phase_a_unmapped_mutations_p22.py"
      - "docs/security/permissions_phase_a_live_route_map_p25_20261026.md"
      - ".github/workflows/permissions-phase-a-live-map-ci.yml"

permissions:
  contents: read

jobs:
  read-only-route-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: permissions-phase-a-tests-only
      JWT_SECRET_KEY: permissions-phase-a-tests-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: P25–P32 live map, guard, snapshot, action parity and regressions
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/routes/test_permissions_phase_a_live_map_reconcile_p25.py \
            tests/routes/test_permissions_phase_a_route_coverage.py \
            tests/routes/test_permissions_phase_a_unmapped_mutations_p22.py \
            tests/routes/test_permissions_phase_a_cross_family_p27.py \
            tests/routes/test_permissions_phase_a_p28_snapshot_contract.py \
            tests/routes/test_permissions_phase_a_p29_action_reconciliation.py \
            tests/routes/test_permissions_phase_a_p30_live_action_parity.py \
            tests/routes/test_permissions_phase_a_p31_effective_guard_parity.py \
            tests/routes/test_permissions_phase_a_p32_capability_groups.py \
            tests/marketing/test_marketing_campaign_v2_dispatch_config_service.py \
            tests/marketing/test_marketing_campaign_v2_scoped_dispatch_exclusions.py \
            tests/google_ads/test_google_ads_m6_authenticated_approval.py \
            tests/purchase_requisitions/test_purchase_requisition_permissions.py \
            tests/purchase_requisitions/test_purchase_requisition_finance_approvers.py \
            tests/services/test_ticket_maintenance_coordination_service.py \
            tests/utils/test_tickets_maintenance_permissions.py \
            tests/services/test_ticket_tapizado_m4_recepcion.py \
            tests/services/test_ticket_tapizado_m41_lote.py \
            tests/routes/test_inventario_correccion_codigo_auditada_qa13.py \
            tests/routes/test_inventario_eliminar_movimiento_qa.py \
            tests/routes/test_openings_lifecycle_routes.py \
            tests/test_track_alert_routes_p29_auth.py \
            tests/test_track_alert_routes.py \
            tests/contact_center/test_contact_center_access.py \
            tests/contact_center/test_contact_center_manager_scope_contract.py \
            tests/purchase_requisitions/test_permissions_phase_a_finance_approval_p23.py \
            tests/purchase_requisitions/test_permissions_phase_a_finance_rejection_p24.py \
            tests/system_daily_check/test_system_daily_check_access.py \
            tests/automation_control/test_read_api.py
