name: Automation Control and iVentas Diagnostics CI

on:
  pull_request:
    paths:
      - "backend/app/models/marketing.py"
      - "backend/app/models/__init__.py"
      - "backend/app/routes/automation_control_routes.py"
      - "backend/app/services/automation_control/**"
      - "backend/app/services/marketing_iventas_run_*"
      - "backend/app/utils/automation_control_access.py"
      - "backend/migrations/versions/f62a1b9d4c07_iventas_branch_failure_diagnostics.py"
      - "backend/tests/automation_control/**"
      - "backend/tests/services/test_marketing_iventas_run_*"
      - "frontend/src/app/automation-control/**"
      - "frontend/tests/automation-control-reference-display.test.cjs"
      - ".github/workflows/automation-control-iventas-diagnostics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-postgres:
    name: Backend tests and isolated PostgreSQL 16 migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automations_ci
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: automations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automations_ci -d automations_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: synthetic-ci-secret
      JWT_SECRET_KEY: synthetic-ci-jwt
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      IVENTAS_DIAG_TEST_POSTGRES_URL: "postgresql://automations_ci:synthetic-ci-password@127.0.0.1:5432/automations_ci"
      CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked backend dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile migration and affected services
        run: |
          python -m py_compile \
            app/models/marketing.py \
            app/services/automation_control/diagnostic_service.py \
            app/services/marketing_iventas_run_lifecycle_service.py \
            app/services/marketing_iventas_run_sync_service.py \
            migrations/versions/f62a1b9d4c07_iventas_branch_failure_diagnostics.py
      - name: Regression + real PostgreSQL 16 migration (synthetic only)
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/automation_control \
            tests/services/test_marketing_iventas_run_lifecycle_service.py \
            tests/services/test_marketing_iventas_run_sync_service.py

  frontend:
    name: Angular typecheck, contract, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --project tsconfig.app.json --noEmit
      - name: Timeline semantics
        run: node --test tests/automation-control-reference-display.test.cjs
      - name: Angular production build
        run: npm run build -- --configuration production
