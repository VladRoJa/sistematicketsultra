name: Fase A P24 Finance Rejection Permission Diagnostics
on:
  pull_request:
    paths:
      - 'backend/tests/purchase_requisitions/test_permissions_phase_a_finance_rejection_p24.py'
      - '.github/workflows/permissions-phase-a-finance-rejection-p24-ci.yml'
permissions:
  contents: read
jobs:
  rejection-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SECRET_KEY: permissions-phase-a-test-only
      JWT_SECRET_KEY: permissions-phase-a-test-only
      SQLALCHEMY_DATABASE_URI: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Verify P24 finance rejection and P23/Purchase Requisition regressions
        run: |
          python -m pytest -q --tb=short -o addopts= tests/purchase_requisitions/test_permissions_phase_a_finance_rejection_p24.py tests/purchase_requisitions/test_permissions_phase_a_finance_approval_p23.py tests/purchase_requisitions/test_purchase_requisition_workflow.py tests/purchase_requisitions/test_purchase_requisition_permissions.py
