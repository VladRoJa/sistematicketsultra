name: M6 Sync Main Once

on:
  push:
    branches:
      - feat/google-ads-m6-continuity
    paths:
      - '.github/workflows/google-ads-m6-sync-main.yml'

permissions:
  contents: write

jobs:
  merge-main-into-m6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Update feature branch with current main (not production)
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/google-ads-m6-continuity"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          echo "MERGING_MAIN_HEAD=$(git rev-parse origin/main)"
          echo "M6_BEFORE=$(git rev-parse HEAD)"
          git merge --no-ff --no-edit origin/main
          echo "M6_AFTER=$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/feat/google-ads-m6-continuity
