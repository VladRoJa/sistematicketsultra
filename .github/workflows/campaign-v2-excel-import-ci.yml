name: Campaign V2 Excel Import CI

on:
  pull_request:
    paths:
      - 'backend/app/services/marketing_campaign_v2_excel_import_service.py'
      - 'backend/app/routes/marketing_campaign_v2_routes.py'
      - 'backend/tests/marketing/test_marketing_campaign_v2_excel_import.py'
      - 'frontend/src/app/marketing-campaign-v2/**'
      - '.github/workflows/campaign-v2-excel-import-ci.yml'
  workflow_dispatch:

jobs:
  backend-excel-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Excel import, QA and provider safety tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/marketing/test_marketing_campaign_v2_excel_import.py tests/marketing/test_marketing_campaign_v2_qa_manual_service.py tests/marketing/test_marketing_campaign_v2_preflight_service.py
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Angular production build
        working-directory: frontend
        run: npm run build
