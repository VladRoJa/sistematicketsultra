name: Tickets Tapizado M3 UI Historiales Reportes

on:
  pull_request:
    paths:
      - "backend/app/routes/ticket_routes.py"
      - "backend/app/routes/inventarios.py"
      - "backend/app/utils/ticket_aparatos_filters.py"
      - "backend/app/services/mantenimiento_report_service.py"
      - "backend/app/services/mantenimiento_equipos_report_service.py"
      - "backend/tests/routes/test_ticket_tapizado_m3_historiales.py"
      - "frontend/src/app/pantalla-crear-ticket/**"
      - "frontend/src/app/pantalla-ver-tickets/**"
      - "frontend/tests/tickets-tapizado-m3.test.cjs"
      - ".github/workflows/tickets-tapizado-m3-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-m3:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: tickets-tapizado-m3-ci-only
      JWT_SECRET_KEY: tickets-tapizado-m3-ci-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile affected backend
        run: |
          python -m py_compile app/routes/ticket_routes.py app/routes/inventarios.py app/utils/ticket_aparatos_filters.py app/services/mantenimiento_report_service.py app/services/mantenimiento_equipos_report_service.py
      - name: Tapizado M3, M2 and permissions regression
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/routes/test_ticket_tapizado_m3_historiales.py \
            tests/routes/test_ticket_tapizado_m2.py \
            tests/routes/test_create_ticket_requires_apparatus.py \
            tests/services/test_mantenimiento_report_service.py \
            tests/services/test_mantenimiento_equipos_report_service.py \
            tests/utils/test_maintenance_regional_lead.py

  frontend-m3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Contract tests for M3
        run: node --test tests/tickets-tapizado-m3.test.cjs
      - name: Angular template and typecheck
        run: npx ngc -p tsconfig.app.json
      - name: Production build
        run: npm run build -- --configuration production
