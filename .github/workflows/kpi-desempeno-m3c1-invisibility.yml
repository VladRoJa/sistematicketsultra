name: KPI Desempeno M3-C1 Reader Invisibility

on:
  pull_request:
    paths:
      - 'backend/app/warehouse/services/track_daily_query_version_service.py'
      - 'backend/app/warehouse/services/planning_targets_service.py'
      - 'backend/app/warehouse/services/kpi_desempeno_query_service.py'
      - 'backend/app/track_alerts/services/track_alert_rules_service.py'
      - 'backend/app/warehouse/services/track_forecast_service.py'
      - 'backend/app/routes/track_routes.py'
      - 'backend/app/warehouse/services/scheduler_priority_service.py'
      - 'backend/tests/warehouse/test_track_m3c1_reader_invisibility_postgres.py'
      - 'docs/contratos/SUITE_ULTRA_M3C1_TRACK_READER_INVISIBILITY_AUDIT.md'
      - '.github/workflows/kpi-desempeno-m3c1-invisibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-postgres16-invisibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: m3c1_ci
          POSTGRES_PASSWORD: synthetic-m3c1-only
          POSTGRES_DB: m3c1_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m3c1_ci -d m3c1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SECRET_KEY: synthetic-m3c1-ci-only
      JWT_SECRET_KEY: synthetic-m3c1-jwt-only
      SQLALCHEMY_DATABASE_URI: 'sqlite:///:memory:'
      M3C1_TEST_POSTGRES_URL: 'postgresql://m3c1_ci:synthetic-m3c1-only@127.0.0.1:5432/m3c1_ci'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install existing backend dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile changed sources
        run: |
          python -m py_compile \
            app/warehouse/services/track_daily_query_version_service.py \
            app/warehouse/services/planning_targets_service.py \
            app/warehouse/services/kpi_desempeno_query_service.py \
            app/track_alerts/services/track_alert_rules_service.py \
            app/warehouse/services/track_forecast_service.py \
            app/routes/track_routes.py \
            app/warehouse/services/scheduler_priority_service.py \
            tests/warehouse/test_track_m3c1_reader_invisibility_postgres.py
      - name: Test synthetic PostgreSQL16 and resolver regressions
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/warehouse/test_track_m3c1_reader_invisibility_postgres.py \
            tests/warehouse/test_track_daily_query_version_service.py \
            tests/test_track_alert_region_rules_service.py \
            tests/test_track_forecast_service.py \
            tests/test_track_excel_export_service.py \
            tests/warehouse/test_commercial_daily_reports_service.py \
            tests/test_track_regional_operational_service.py \
            tests/test_track_branch_operational_detail_service.py
