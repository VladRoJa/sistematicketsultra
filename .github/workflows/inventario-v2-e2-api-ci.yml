name: Inventarios V2 E2 Solicitudes API CI

on:
  pull_request:
    paths:
      - "backend/app/routes/inventario_solicitudes_routes.py"
      - "backend/app/__init__.py"
      - "backend/tests/routes/test_inventario_solicitudes_e2_api_pg.py"
      - ".github/workflows/inventario-v2-e2-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2-api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventario_e2_api_ci
          POSTGRES_PASSWORD: inventario_e2_api_ci_only
          POSTGRES_DB: inventario_e2_api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventario_e2_api_ci -d inventario_e2_api_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: Python syntax
        working-directory: backend
        run: |
          python -m py_compile \
            app/routes/inventario_solicitudes_routes.py \
            app/__init__.py \
            tests/routes/test_inventario_solicitudes_e2_api_pg.py
      - name: API E2: JWT, scope DB, IDOR, stale, idempotency, V1 inmutable
        working-directory: backend
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SECRET_KEY: inv-e2-api-only
          JWT_SECRET_KEY: inv-e2-api-only
          INVENTARIO_E2_TEST_POSTGRES_URL: postgresql+psycopg2://inventario_e2_api_ci:inventario_e2_api_ci_only@127.0.0.1:5432/inventario_e2_api_ci
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/routes/test_inventario_solicitudes_e2_api_pg.py
