name: Campaign V2 Scoped Exclusions

on:
  pull_request:
    paths:
      - "backend/app/models/marketing.py"
      - "backend/app/models/__init__.py"
      - "backend/app/services/marketing_campaign_v2_dispatch_exclusion_service.py"
      - "backend/app/services/marketing_campaign_v2_delivery_export_service.py"
      - "backend/app/services/marketing_campaign_v2_preflight_service.py"
      - "backend/migrations/versions/d8f1c3a9b204_add_campaign_v2_scoped_dispatch_exclusions.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_scoped*"
      - ".github/workflows/campaign-v2-scoped-exclusions.yml"
  push:
    branches: ["fix/campaign-v2-scoped-exclusions"]

permissions:
  contents: read

jobs:
  check-exclusions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: m3_test
          POSTGRES_PASSWORD: m3_test_only
          POSTGRES_DB: m3_child_snapshots
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U m3_test -d m3_child_snapshots"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest==8.3.5"
      - name: Scoped exclusion regression and real PostgreSQL migration
        working-directory: backend
        env:
          M3_TEST_POSTGRES_URL: postgresql+psycopg2://m3_test:m3_test_only@127.0.0.1:5432/m3_child_snapshots
          SECRET_KEY: isolated-scoped-qa-secret
          JWT_SECRET_KEY: isolated-scoped-qa-jwt
          CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"
        run: |
          python -m pytest -q --tb=short \
            tests/marketing/test_marketing_campaign_v2_scoped_dispatch_exclusions.py \
            tests/marketing/test_marketing_campaign_v2_scoped_exclusion_migration.py \
            tests/marketing/test_marketing_campaign_v2_delivery_export_service.py \
            tests/marketing/test_marketing_campaign_v2_preflight_service.py
