name: Nube Corporativa — A-13 Listing Visibility

on:
  pull_request:
    paths:
      - "backend/app/routes/internal_documents_routes.py"
      - "backend/tests/routes/test_internal_documents_a13_list_visibility.py"
      - "backend/tests/routes/test_internal_documents_a12_a13_http_jwt_reconcile.py"
      - "docs/security/internal_documents_a12_a13_reconciliation_20261026.md"
      - ".github/workflows/internal-documents-a13-list-parity-ci.yml"

permissions:
  contents: read

jobs:
  a13-list-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: permissions-phase-a-test-only
      JWT_SECRET_KEY: permissions-phase-a-test-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Validate listing, pagination, and existing Nube protections
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/routes/test_internal_documents_a13_list_visibility.py \
            tests/routes/test_internal_documents_a12_a13_http_jwt_reconcile.py \
            tests/routes/test_internal_documents_a12_audit_visibility.py \
            tests/routes/test_internal_documents_agregadoras_visibility.py \
            tests/utils/test_internal_documents_agregadoras_access.py
