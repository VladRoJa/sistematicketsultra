name: Inventario Dashboard Reportes QA-25

on:
  pull_request:
    paths:
      - 'frontend/src/app/inventario/reportes/**'
      - '.github/workflows/inventario-dashboard-reportes-qa25-ci.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Angular production build (TypeScript and HTML templates)
        run: npm run build -- --configuration production
