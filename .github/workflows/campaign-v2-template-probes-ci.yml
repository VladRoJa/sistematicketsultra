name: Campaign V2 Controlled Template Probes
on:
  pull_request:
    paths:
      - "backend/app/services/marketing_campaign_v2*"
      - "backend/app/routes/marketing_campaign_v2_routes.py"
      - "backend/tests/marketing/test_campaign_v2_template_probes*"
      - "backend/tests/marketing/test_campaign_v2_bulk_template_evidence*"
      - "frontend/src/app/marketing-campaign-v2/**"
      - ".github/workflows/campaign-v2-template-probes-ci.yml"
permissions:
  contents: read
jobs:
  controlled-qa-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quota_ci
          POSTGRES_PASSWORD: synthetic-probes-only
          POSTGRES_DB: quota_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quota_ci -d quota_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SECRET_KEY: synthetic-template-probe-tests-only
      JWT_SECRET_KEY: synthetic-template-probe-jwt-tests-only
      QUOTA_TEST_POSTGRES_URL: postgresql://quota_ci:synthetic-probes-only@127.0.0.1:5432/quota_ci
      CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"
      CAMPAIGN_V2_GOVERNED_DISPATCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: Controlled probes and existing dispatch safety regressions
        working-directory: backend
        run: |
          python -m pytest -q --tb=short \
            tests/marketing/test_campaign_v2_template_probes.py \
            tests/marketing/test_campaign_v2_template_probes_http.py \
            tests/marketing/test_campaign_v2_template_evidence.py \
            tests/marketing/test_campaign_v2_bulk_template_evidence.py \
            tests/marketing/test_campaign_v2_bulk_template_evidence_http.py \
            tests/marketing/test_campaign_v2_template_probes_pg.py \
            tests/marketing/test_marketing_campaign_v2_qa_http.py \
            tests/marketing/test_marketing_campaign_v2_qa_manual_service.py \
            tests/marketing/test_marketing_campaign_v2_preflight_service.py \
            tests/marketing/test_campaign_v2_channel_routing.py \
            tests/marketing/test_campaign_v2_confirmed_failures.py \
            tests/marketing/test_issue_856_stage_e_gates.py \
            tests/marketing/test_marketing_permissions_p26_9_integral_inventory.py \
            tests/marketing/test_marketing_campaign_v2_quota_dispatch_real_pg.py \
            tests/integrations/test_iventas_broadcast_provider.py
  controlled-qa-angular:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile Angular templates and types
        run: node node_modules/@angular/compiler-cli/bundles/src/bin/ngc.js -p tsconfig.app.json --noEmit
      - name: Check confirmation, duplicate clicks and stale UI results
        run: |
          node node_modules/esbuild/bin/esbuild src/app/marketing-campaign-v2/marketing-campaign-v2-template-probes.component.node-test.ts --bundle --platform=node --format=esm --external:@angular/* --external:rxjs --external:rxjs/* --outfile=node_modules/.cache/template-probes-tests.mjs
          node node_modules/.cache/template-probes-tests.mjs
