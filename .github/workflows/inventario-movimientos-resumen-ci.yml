name: Inventario Movimientos Resumen QA-14 CI

on:
  pull_request:
    paths:
      - "frontend/src/app/inventario/movimientos/**"
      - "frontend/tests/inventario-movimientos-resumen-qa14.test.cjs"
      - ".github/workflows/inventario-movimientos-resumen-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: QA-14 Movimiento resumen y detalle
        run: node --test tests/inventario-movimientos-resumen-qa14.test.cjs
      - name: Angular TypeScript
        run: npx tsc --noEmit --project tsconfig.app.json
      - name: Production build
        run: npm run build -- --configuration production
