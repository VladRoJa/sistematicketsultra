name: Inventario Existencias Codigo Backend CI

on:
  pull_request:
    paths:
      - "backend/app/routes/inventarios.py"
      - "backend/tests/routes/test_inventario_existencias_codigo_qa.py"
      - "backend/tests/routes/test_inventario_existencias_v2_access_qa.py"
      - ".github/workflows/inventario-existencias-codigo-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: qa10e-only
      JWT_SECRET_KEY: qa10e-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Verify Python syntax
        run: python -m py_compile app/routes/inventarios.py tests/routes/test_inventario_existencias_codigo_qa.py tests/routes/test_inventario_existencias_v2_access_qa.py
      - name: QA-10E Existencias codigo interno
        run: python -m pytest -q --tb=short -o addopts= tests/routes/test_inventario_existencias_codigo_qa.py tests/routes/test_inventario_existencias_v2_access_qa.py
