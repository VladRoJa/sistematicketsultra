name: System Daily Check M3

on:
  pull_request:
    paths:
      - "backend/app/__init__.py"
      - "backend/app/models/system_daily_check.py"
      - "backend/app/models/__init__.py"
      - "backend/app/routes/system_daily_check_routes.py"
      - "backend/app/routes/system_daily_check_bi_routes.py"
      - "backend/app/services/system_daily_check_service.py"
      - "backend/app/services/system_daily_check_attachment_service.py"
      - "backend/app/services/system_daily_check_attachment_storage_service.py"
      - "backend/app/services/system_daily_check_bi_service.py"
      - "backend/migrations/versions/**"
      - "backend/tests/system_daily_check/**"
      - "frontend/src/app/app.routes.ts"
      - "frontend/src/app/layout/layout.component.ts"
      - "frontend/src/app/system-daily-check/**"
      - "frontend/src/app/system-daily-check-bi/**"
      - "frontend/tests/system-daily-check-*.test.ts"
      - "frontend/tests/system-daily-check-*.test.cjs"
      - "docs/contratos/checklist_sistemas/**"
      - ".github/workflows/system-daily-check-m3.yml"
  push:
    branches:
      - "feat/checklist-sistemas-v1-m3"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: m1_test
          POSTGRES_PASSWORD: m1_test_only
          POSTGRES_DB: system_daily_check_m1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m1_test -d system_daily_check_m1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test runtime
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest==8.3.5"
      - name: Run checklist M1-M3 backend tests
        working-directory: backend
        env:
          SECRET_KEY: isolated-system-daily-check-secret
          JWT_SECRET_KEY: isolated-system-daily-check-jwt
          SYSTEM_DAILY_CHECK_TEST_POSTGRES_URL: postgresql+psycopg2://m1_test:m1_test_only@127.0.0.1:5432/system_daily_check_m1_test
        run: |
          python -m pytest -q --tb=short tests/system_daily_check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test M2 gate state
        run: |
          rm -rf .tmp-system-daily-check-gate
          ./node_modules/.bin/tsc             --target ES2020             --module commonjs             --moduleResolution node             --strict             --skipLibCheck             --outDir .tmp-system-daily-check-gate             src/app/system-daily-check/system-daily-check-gate-state.ts             tests/system-daily-check-gate-state.test.ts
          node .tmp-system-daily-check-gate/tests/system-daily-check-gate-state.test.js
          rm -rf .tmp-system-daily-check-gate
      - name: Test M3 BI presentation state
        run: |
          rm -rf .tmp-system-daily-check-m3
          ./node_modules/.bin/tsc             --target ES2020             --module commonjs             --moduleResolution node             --strict             --skipLibCheck             --outDir .tmp-system-daily-check-m3             src/app/system-daily-check-bi/system-daily-check-bi-state.ts             tests/system-daily-check-health-state.test.ts
          node .tmp-system-daily-check-m3/tests/system-daily-check-health-state.test.js
          rm -rf .tmp-system-daily-check-m3
      - name: Test M3 UI contract
        run: node tests/system-daily-check-bi-ui-contract.test.cjs
      - name: Build Angular
        run: npm run build -- --progress=false
