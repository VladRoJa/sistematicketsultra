name: Inventario Dashboard Resumen QA-24

on:
  pull_request:
    paths:
      - "backend/app/services/inventario_dashboard_service.py"
      - "backend/app/routes/inventarios.py"
      - "backend/tests/routes/test_inventario_dashboard_resumen_qa24.py"
      - ".github/workflows/inventario-dashboard-resumen-qa24-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: inventory-qa24-ci-only
      JWT_SECRET_KEY: inventory-qa24-ci-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Python syntax
        run: |
          python -m py_compile app/services/inventario_dashboard_service.py app/routes/inventarios.py tests/routes/test_inventario_dashboard_resumen_qa24.py
      - name: QA-24 dashboard aggregated data, DEMO exclusion, permission scope
        run: python -m pytest -q --tb=short -o addopts= tests/routes/test_inventario_dashboard_resumen_qa24.py
      - name: QA-21/22 movement regressions
        run: python -m pytest -q --tb=short -o addopts= tests/routes/test_inventario_eliminar_movimiento_qa.py tests/routes/test_inventario_historial_descriptores_qa22c.py tests/routes/test_inventario_movimientos_cantidad_qa.py
