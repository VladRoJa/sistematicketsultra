name: Gasca SMS Sender Safety

on:
  pull_request:
    paths:
      - "backend/app/rpa/services/google_messages_sms_sender_service.py"
      - "backend/tests/test_google_messages_sms_sender_service.py"
      - ".github/workflows/gasca-sms-sender-safety-ci.yml"
  push:
    branches:
      - "fix/gasca-sms-editor-read-fail-closed-20261014"

permissions:
  contents: read

jobs:
  sender-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser automation API only
        run: python -m pip install "playwright==1.54.0"
      - name: Validate module syntax
        run: python -m py_compile backend/app/rpa/services/google_messages_sms_sender_service.py
      - name: Run safe SMS editor tests (no outbound sends)
        run: python -m unittest discover -s backend/tests -p 'test_google_messages_sms_sender_service.py' -v
