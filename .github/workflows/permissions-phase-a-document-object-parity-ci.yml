name: Fase A — Nube Document Object Permission Parity

on:
  pull_request:
    paths:
      - "backend/tests/utils/test_permissions_phase_a_document_object_parity.py"
      - ".github/workflows/permissions-phase-a-document-object-parity-ci.yml"
      - "backend/app/utils/internal_documents_access.py"
      - "backend/app/routes/internal_documents_routes.py"

permissions:
  contents: read

jobs:
  document-object-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: permissions-phase-a-test-only
      JWT_SECRET_KEY: permissions-phase-a-test-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Validate Nube object context and A11-A13 regressions
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/utils/test_permissions_phase_a_document_object_parity.py \
            tests/utils/test_internal_documents_agregadoras_access.py \
            tests/routes/test_internal_documents_a12_audit_visibility.py \
            tests/routes/test_internal_documents_a13_list_visibility.py \
            tests/routes/test_internal_documents_agregadoras_visibility.py
