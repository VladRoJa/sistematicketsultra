name: Track Socios Equivalentes Focal CI

on:
  pull_request:
    paths:
      - 'backend/app/warehouse/services/track_socios_equivalentes_service.py'
      - 'backend/app/routes/track_routes.py'
      - 'backend/tests/warehouse/test_track_socios_equivalentes_service.py'
      - '.github/workflows/track-socios-equivalentes-ci.yml'

permissions:
  contents: read

jobs:
  track-equivalentes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: Validate Python syntax
        run: python -m py_compile backend/app/warehouse/services/track_socios_equivalentes_service.py backend/app/routes/track_routes.py backend/tests/warehouse/test_track_socios_equivalentes_service.py
      - name: Test equivalent members and Track authorization
        run: python -m pytest -q backend/tests/warehouse/test_track_socios_equivalentes_service.py backend/tests/routes/test_permissions_live_track_read_check.py
