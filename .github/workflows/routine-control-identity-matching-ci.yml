name: Routine Control Identity Matching CI

on:
  pull_request:
    paths:
      - "backend/app/routine_control/pipeline/matching_policy.py"
      - "backend/tests/routine_control/test_matching_policy.py"
      - "backend/tests/routine_control/test_matching_policy_name_variants.py"
      - ".github/workflows/routine-control-identity-matching-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matching:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      SECRET_KEY: routine-control-matching-ci
      JWT_SECRET_KEY: routine-control-matching-ci
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile \
            app/routine_control/pipeline/matching_policy.py \
            tests/routine_control/test_matching_policy.py \
            tests/routine_control/test_matching_policy_name_variants.py
      - name: Run matching policy regression tests
        run: python -m unittest discover -s tests/routine_control -p 'test_matching_policy*.py' -v
