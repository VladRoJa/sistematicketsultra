name: Funnel Original · Histórico semanal

on:
  pull_request:
    paths:
      - 'backend/app/services/marketing_sales_funnel_weekly_export_service.py'
      - 'backend/app/routes/marketing_sales_funnel_routes.py'
      - 'backend/tests/marketing/test_marketing_sales_funnel_weekly_export.py'
      - 'backend/tests/marketing/test_marketing_sales_funnel_routes.py'
      - 'backend/tests/frontend/test_marketing_sales_funnel_google_m5_presentation.py'
      - 'frontend/src/app/marketing-sales-funnel/marketing-sales-funnel-original.*'
      - '.github/workflows/funnel-original-weekly-export-ci.yml'
  workflow_dispatch:

jobs:
  qa-xlsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pure workbook test dependencies
        run: python -m pip install 'pytest>=8,<9' 'XlsxWriter==3.2.2'
      - name: Compile Python service and route
        run: python -m py_compile backend/app/services/marketing_sales_funnel_weekly_export_service.py backend/app/routes/marketing_sales_funnel_routes.py
      - name: Validate weekly cutoffs, workbook and monthly charts
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/marketing/test_marketing_sales_funnel_weekly_export.py

  qa-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install 'pytest>=8,<9'
      - name: Verify ADMICORP-only access and legacy export fallback
        env:
          PYTHONPATH: backend
          SECRET_KEY: funnel-weekly-ci
          JWT_SECRET_KEY: funnel-weekly-ci-jwt
        run: |
          python -m pytest -q backend/tests/marketing/test_marketing_sales_funnel_routes.py \
            backend/tests/frontend/test_marketing_sales_funnel_google_m5_presentation.py

  qa-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Angular dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --configuration production
