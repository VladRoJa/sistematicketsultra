name: BI Vlad — Tickets catalog and routing

on:
  pull_request:
    paths:
      - "backend/app/models/ticket_model.py"
      - "backend/app/routes/ticket_routes.py"
      - "backend/migrations/versions/m1232bivlad111026_ticket_department_catalog.py"
      - "backend/tests/migrations/test_bi_vlad_ticket_catalog_seed.py"
      - "backend/tests/routes/test_bi_vlad_ticket_assignment.py"
      - "backend/tests/routes/test_ticket_create_attachment_integration.py"
      - "backend/tests/routes/test_ticket_tapizado_m2.py"
      - "backend/tests/test_ticket_creator_closure_flow.py"
      - ".github/workflows/bi-vlad-tickets-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bi-vlad-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: bi-vlad-ci-only
      JWT_SECRET_KEY: bi-vlad-ci-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      NOTIFY_EMAIL_ON_UPDATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile affected code
        run: |
          python -m py_compile app/models/ticket_model.py app/routes/ticket_routes.py \
            migrations/versions/m1232bivlad111026_ticket_department_catalog.py \
            tests/migrations/test_bi_vlad_ticket_catalog_seed.py \
            tests/routes/test_bi_vlad_ticket_assignment.py
      - name: BI Vlad and impacted legacy Tickets flow
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/migrations/test_bi_vlad_ticket_catalog_seed.py \
            tests/routes/test_bi_vlad_ticket_assignment.py \
            tests/routes/test_ticket_create_attachment_integration.py \
            tests/routes/test_ticket_tapizado_m2.py \
            tests/routes/test_create_ticket_requires_apparatus.py \
            tests/test_ticket_creator_closure_flow.py \
            tests/models/test_ticket_create_transaction_mode.py
