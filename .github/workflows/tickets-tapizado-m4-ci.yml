name: Tickets Tapizado M4 - Recepcion Parcial

on:
  pull_request:
    paths:
      - "backend/app/models/ticket_aparato.py"
      - "backend/app/models/ticket_model.py"
      - "backend/app/services/ticket_tapizado_recepcion_service.py"
      - "backend/app/routes/ticket_routes.py"
      - "backend/app/config.py"
      - "backend/migrations/versions/m23c10202623_tapizado_recepcion_parcial.py"
      - "backend/tests/services/test_ticket_tapizado_m4_recepcion.py"
      - "backend/tests/models/test_ticket_tapizado_m4_migration.py"
      - "frontend/src/app/services/ticket.service.ts"
      - "frontend/src/app/pantalla-ver-tickets/**"
      - "frontend/tests/tickets-tapizado-recepcion-m4.test.cjs"
      - ".github/workflows/tickets-tapizado-m4-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SECRET_KEY: tickets-tapizado-m4-ci-only
      JWT_SECRET_KEY: tickets-tapizado-m4-ci-only
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile affected files
        run: |
          python -m py_compile app/models/ticket_aparato.py app/models/ticket_model.py app/services/ticket_tapizado_recepcion_service.py app/routes/ticket_routes.py migrations/versions/m23c10202623_tapizado_recepcion_parcial.py
      - name: M4, M3, M2, migration and close-flow regression
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/services/test_ticket_tapizado_m4_recepcion.py \
            tests/models/test_ticket_tapizado_m4_migration.py \
            tests/routes/test_ticket_tapizado_m3_historiales.py \
            tests/routes/test_ticket_tapizado_m2.py \
            tests/routes/test_create_ticket_requires_apparatus.py \
            tests/utils/test_maintenance_regional_lead.py

  frontend-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: M4/M3 interface contracts
        run: |
          node --test tests/tickets-tapizado-recepcion-m4.test.cjs tests/tickets-tapizado-m3.test.cjs tests/tickets-tapizado-selector-freeze-m31.test.cjs tests/tickets-tapizado-ui-m32.test.cjs
      - name: Angular typecheck and templates
        run: npx ngc -p tsconfig.app.json
      - name: Production build
        run: npm run build -- --configuration production
