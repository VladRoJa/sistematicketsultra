name: Campaign V2 Partial Resume Safety

on:
  pull_request:
    paths:
      - "backend/app/services/marketing_campaign_v2_partial_resume_service.py"
      - "backend/app/services/marketing_campaign_v2_deterministic_rejection_retry.py"
      - "backend/scripts/resume_campaign8_pending.py"
      - "backend/scripts/resume_campaign41_ready.py"
      - "backend/app/services/marketing_campaign_v2_governed_recovery_service.py"
      - "backend/scripts/retry_campaign8_la_paz.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_partial_resume.py"
      - "backend/tests/marketing/test_resume_campaign41_ready.py"
      - "backend/tests/marketing/test_campaign41_governed_recovery_pg.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_deterministic_rejection_retry.py"
      - ".github/workflows/campaign-v2-partial-resume.yml"
  push:
    branches: ["fix/campaign-v2-8-partial-resume", "fix/campaign-v2-8-include-paseo-la-paz"]

permissions:
  contents: read

jobs:
  offline-safety-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest==8.3.5"
      - name: Offline provider safety and M2 regression
        working-directory: backend
        env:
          SECRET_KEY: isolated-resume-qa-secret
          JWT_SECRET_KEY: isolated-resume-qa-jwt
          CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"
        run: |
          python -m pytest -q --tb=short \
            tests/marketing/test_marketing_campaign_v2_partial_resume.py \
            tests/marketing/test_resume_campaign41_ready.py \
            tests/marketing/test_marketing_campaign_v2_deterministic_rejection_retry.py \
            tests/marketing/test_marketing_campaign_v2_submit_service.py \
            tests/marketing/test_marketing_campaign_v2_retry_service.py \
            tests/marketing/test_marketing_campaign_v2_preflight_service.py \
            tests/marketing/test_marketing_campaign_v2_scoped_dispatch_exclusions.py


  governed-recovery-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quota_ci
          POSTGRES_PASSWORD: synthetic-quota-only
          POSTGRES_DB: quota_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quota_ci -d quota_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: synthetic-only-campaign41-ci
      JWT_SECRET_KEY: synthetic-only-campaign41-ci
      QUOTA_TEST_POSTGRES_URL: postgresql://quota_ci:synthetic-quota-only@127.0.0.1:5432/quota_ci
      CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"
      CAMPAIGN_V2_GOVERNED_DISPATCH_ENABLED: "false"
      IVENTAS_CAMPAIGN_SEND_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test runtime
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest==8.3.5"
      - name: Verify durable claim, immutable failed child and replay guard
        working-directory: backend
        run: |
          python -m pytest -q --tb=short tests/marketing/test_campaign41_governed_recovery_pg.py
