name: Inventario Movimientos Modal UX QA-15 CI

on:
  pull_request:
    paths:
      - "frontend/src/app/inventario/movimientos/dialogo-registrar-movimiento/**"
      - "frontend/src/app/inventario/movimientos/movimientos.component.ts"
      - "frontend/tests/inventario-movimientos-modal-qa15.test.cjs"
      - ".github/workflows/inventario-movimientos-modal-qa15-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: QA-15 Movement modal UX and Santa Fe batch
        run: node --test tests/inventario-movimientos-modal-qa15.test.cjs
      - name: QA-14 Movement history regression
        run: node --test tests/inventario-movimientos-resumen-qa14.test.cjs
      - name: Angular template and typecheck
        run: npx ngc -p tsconfig.app.json
      - name: Production build
        run: npm run build -- --configuration production
