name: KPI Desempeno Semantic Diff M1

on:
  pull_request:
    paths:
      - 'backend/app/warehouse/services/kpi_desempeno_semantic_diff.py'
      - 'backend/app/warehouse/services/kpi_desempeno_parser.py'
      - 'backend/tests/warehouse/test_kpi_desempeno_semantic_diff.py'
      - '.github/workflows/kpi-desempeno-semantic-diff-m1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-diff:
    name: Read-only semantic detector tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SECRET_KEY: synthetic-kpi-semantic-m1-secret
      JWT_SECRET_KEY: synthetic-kpi-semantic-m1-jwt
      SQLALCHEMY_DATABASE_URI: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile detector and tests
        run: |
          python -m py_compile \
            app/warehouse/services/kpi_desempeno_semantic_diff.py \
            tests/warehouse/test_kpi_desempeno_semantic_diff.py
      - name: Run synthetic semantic-comparison tests
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/warehouse/test_kpi_desempeno_semantic_diff.py
