name: Warehouse Contact Center Evidence Retention PostgreSQL

on:
  pull_request:
    paths:
      - 'backend/app/warehouse/services/warehouse_retention_service.py'
      - 'backend/tests/warehouse/test_warehouse_retention_contact_center_evidence.py'
      - 'backend/tests/warehouse/test_warehouse_retention_contact_center_postgres.py'
      - '.github/workflows/warehouse-retention-contact-center-postgres.yml'

permissions:
  contents: read

jobs:
  retention-postgresql16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retention_ci
          POSTGRES_PASSWORD: synthetic_retention_only
          POSTGRES_DB: warehouse_retention_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retention_ci -d warehouse_retention_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SECRET_KEY: synthetic-retention-only
      JWT_SECRET_KEY: synthetic-retention-jwt-only
      SQLALCHEMY_DATABASE_URI: 'sqlite:///:memory:'
      WAREHOUSE_RETENTION_TEST_POSTGRES_URL: 'postgresql+psycopg2://retention_ci:synthetic_retention_only@127.0.0.1:5432/warehouse_retention_ci'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile retention service and QA
        run: |
          python -m py_compile \
            app/warehouse/services/warehouse_retention_service.py \
            tests/warehouse/test_warehouse_retention_contact_center_evidence.py \
            tests/warehouse/test_warehouse_retention_contact_center_postgres.py
      - name: PostgreSQL 16 evidence preservation and SQL contract
        run: |
          python -m pytest -q --tb=short --capture=tee-sys -o addopts= \
            tests/warehouse/test_warehouse_retention_contact_center_evidence.py \
            tests/warehouse/test_warehouse_retention_contact_center_postgres.py
