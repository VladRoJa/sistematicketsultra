name: Google Ads M5 Funnel Presentation

on:
  pull_request:
    paths:
      - 'backend/app/services/marketing_sales_funnel_cutoff_service.py'
      - 'backend/app/services/marketing_google_ads_branch_attribution_service.py'
      - 'backend/tests/marketing/test_google_ads_m5_funnel_presentation.py'
      - 'backend/tests/frontend/test_marketing_sales_funnel_google_m5_presentation.py'
      - 'frontend/src/app/marketing-sales-funnel/**'
      - '.github/workflows/google-ads-m5-funnel-presentation.yml'
  push:
    branches:
      - feat/google-ads-m5-funnel-presentation-20261013

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: google_ads_m5_ci
          POSTGRES_PASSWORD: isolated_google_ads_m5
          POSTGRES_DB: google_ads_m5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U google_ads_m5_ci -d google_ads_m5_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: M5 scope, Funnel, Meta and frontend contract tests
        working-directory: backend
        env:
          SECRET_KEY: google-ads-m5-funnel-ci
          JWT_SECRET_KEY: google-ads-m5-funnel-ci-jwt
          GOOGLE_ADS_M5_TEST_POSTGRES_URL: postgresql+psycopg2://google_ads_m5_ci:isolated_google_ads_m5@127.0.0.1:5432/google_ads_m5_test
        run: |
          python -m pytest -q --tb=short \
            tests/google_ads \
            tests/marketing/test_google_ads_funnel_investment.py \
            tests/marketing/test_google_ads_m5_funnel_presentation.py \
            tests/marketing/test_marketing_sales_funnel_cutoff_service.py \
            tests/frontend/test_marketing_sales_funnel_google_m5_presentation.py \
            tests/frontend/test_marketing_sales_funnel_historical_frontend_contract.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Compile TypeScript
        working-directory: frontend
        run: node node_modules/typescript/bin/tsc --noEmit --project tsconfig.app.json
      - name: Build Angular templates and styles
        working-directory: frontend
        run: npm run build -- --configuration=production
