name: Inventario Existencias Spinner CI

on:
  pull_request:
    paths:
      - "frontend/src/app/inventario/existencias/**"
      - "frontend/tests/inventario-existencias-spinner-qa10.test.cjs"
      - ".github/workflows/inventario-existencias-spinner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: QA-10C Existencias loading spinner
        run: node --test tests/inventario-existencias-spinner-qa10.test.cjs
      - name: Type-check Angular
        run: npx tsc --noEmit --project tsconfig.app.json
      - name: Production build
        run: npm run build -- --configuration production
