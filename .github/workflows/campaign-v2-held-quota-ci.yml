name: Campaign V2 HELD Quota CI

on:
  pull_request:
    paths:
      - "backend/app/models/marketing.py"
      - "backend/app/services/marketing_campaign_v2_submit_service.py"
      - "backend/app/services/marketing_campaign_v2_partial_resume_service.py"
      - "backend/scripts/submit_winback_general_held_independencia.py"
      - "backend/migrations/versions/d92c15a8f63b_campaign_v2_audited_held_children.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_submit_service.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_held_quota_migration.py"
      - ".github/workflows/campaign-v2-held-quota-ci.yml"
  push:
    branches:
      - feat/campaign15-channel-quota-hold

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hold_ci
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: held_quota_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hold_ci -d held_quota_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend requirements
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile modified code
        run: |
          python -m py_compile \
            backend/app/models/marketing.py \
            backend/app/services/marketing_campaign_v2_submit_service.py \
            backend/app/services/marketing_campaign_v2_partial_resume_service.py \
            backend/scripts/submit_winback_general_held_independencia.py \
            backend/migrations/versions/d92c15a8f63b_campaign_v2_audited_held_children.py
      - name: Controlled quota-hold and submit regression tests
        working-directory: backend
        env:
          SECRET_KEY: synthetic-held-quota-ci
          JWT_SECRET_KEY: synthetic-held-quota-jwt-ci
          CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"
          HELD_QUOTA_TEST_POSTGRES_URL: postgresql://hold_ci:synthetic-ci-password@127.0.0.1:5432/held_quota_ci
        run: |
          python -m pytest -q --tb=short \
            tests/marketing/test_marketing_campaign_v2_submit_service.py \
            tests/marketing/test_marketing_campaign_v2_partial_resume.py \
            tests/marketing/test_marketing_campaign_v2_held_quota_migration.py \
            tests/marketing/test_marketing_campaign_v2_scoped_dispatch_exclusions.py
