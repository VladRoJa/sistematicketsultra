name: Google Ads M5 Controlled Seed

on:
  pull_request:
    paths:
      - 'backend/migrations/data/google_ads_m5_identity_seed_20261012.json'
      - 'backend/migrations/versions/a63e9f21d48b_seed_google_ads_m5_approved_identities.py'
      - 'backend/tests/google_ads/**'
      - '.github/workflows/google-ads-m5-controlled-seed.yml'
  push:
    branches:
      - feat/google-ads-m5-controlled-seed-20261012

permissions:
  contents: read

jobs:
  isolated-postgres-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: google_ads_m5_seed_ci
          POSTGRES_PASSWORD: isolated_google_ads_m5_seed
          POSTGRES_DB: google_ads_m5_seed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U google_ads_m5_seed_ci -d google_ads_m5_seed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: PG16 controlled seed and Google Ads regressions
        working-directory: backend
        env:
          SECRET_KEY: google-ads-m5-seed-ci
          JWT_SECRET_KEY: google-ads-m5-seed-ci-jwt
          GOOGLE_ADS_M5_SEED_TEST_POSTGRES_URL: postgresql+psycopg2://google_ads_m5_seed_ci:isolated_google_ads_m5_seed@127.0.0.1:5432/google_ads_m5_seed_test
        run: |
          python -m pytest -q --tb=short \
            tests/google_ads \
            tests/marketing/test_google_ads_funnel_investment.py
