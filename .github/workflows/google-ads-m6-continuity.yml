name: Google Ads M6 Continuity

on:
  pull_request:
    paths:
      - 'backend/app/models/google_ads_m6_continuity.py'
      - 'backend/app/models/__init__.py'
      - 'backend/migrations/versions/b3e7c2d9a104_google_ads_m6_branch_continuity.py'
      - 'backend/app/models/google_ads_m6_daily_publication.py'
      - 'backend/migrations/versions/d7f2a09c8b61_google_ads_m6_daily_publications.py'
      - 'backend/migrations/versions/a4c85d6e9f20_merge_main_and_google_ads_m6.py'
      - 'backend/migrations/versions/e8b2c41d7a60_google_ads_m6_correction_candidates.py'
      - 'backend/app/models/google_ads_m6_correction.py'
      - 'backend/tests/google_ads/test_google_ads_m6_correction_candidates_postgres.py'
      - 'backend/tests/google_ads/test_google_ads_m6_alembic_merge_graph.py'
      - 'backend/tests/google_ads/test_google_ads_m6_global_publication_reader_postgres.py'
      - 'backend/app/services/marketing_google_ads_funnel_service.py'
      - 'backend/tests/marketing/test_google_ads_funnel_investment.py'
      - 'backend/tests/google_ads/test_google_ads_m6_daily_publication_postgres.py'
      - 'backend/app/warehouse/services/google_ads_m6_continuity_approval_service.py'
      - 'backend/scripts/apply_google_ads_m6_continuity.py'
      - 'backend/app/routes/google_ads_m6_continuity_routes.py'
      - 'backend/app/services/marketing_google_ads_m6_attribution_service.py'
      - 'backend/app/services/marketing_google_ads_m6_daily_attribution_service.py'
      - 'backend/tests/google_ads/test_google_ads_m6_daily_branch_reader.py'
      - 'backend/tests/google_ads/test_google_ads_m6_daily_reader_pg_e2e.py'
      - 'backend/app/warehouse/services/google_ads_m6_daily_pair_preflight.py'
      - 'backend/tests/google_ads/test_google_ads_m6_daily_pair_preflight.py'
      - 'backend/app/warehouse/services/google_ads_m6_manual_preview_service.py'
      - 'backend/tests/google_ads/test_google_ads_m6_manual_preview.py'
      - 'backend/app/warehouse/services/google_ads_m6_manual_confirm_service.py'
      - 'backend/tests/google_ads/test_google_ads_m6_manual_confirm.py'
      - 'backend/tests/google_ads/test_google_ads_m6_manual_raw_postgres.py'
      - 'backend/app/warehouse/services/google_ads_m6_manual_structured_service.py'
      - 'backend/app/warehouse/services/google_ads_m6_manual_publication_service.py'
      - 'backend/app/warehouse/services/google_ads_m6_manual_correction_diagnostic_service.py'
      - 'backend/tests/google_ads/test_google_ads_m6_correction_diagnostic_postgres.py'
      - 'backend/tests/google_ads/test_google_ads_m6_manual_publication_postgres.py'
      - 'backend/tests/google_ads/test_google_ads_m6_manual_structured_postgres.py'
      - 'frontend/src/app/google-ads/**'
      - 'frontend/tests/google-ads-m6/**'
      - 'backend/app/services/marketing_sales_funnel_cutoff_service.py'
      - 'backend/tests/google_ads/test_google_ads_m6_attribution_reader.py'
      - 'backend/tests/google_ads/test_google_ads_m6_attribution_postgres.py'
      - 'backend/app/__init__.py'
      - 'backend/tests/google_ads/test_google_ads_m6_authenticated_approval.py'
      - 'backend/tests/google_ads/test_google_ads_m6_authenticated_postgres.py'
      - 'backend/tests/google_ads/test_google_ads_m6_continuity_*.py'
      - '.github/workflows/google-ads-m6-continuity.yml'
  push:
    branches:
      - feat/google-ads-m6-continuity

permissions:
  contents: read

jobs:
  approval-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: google_ads_m6_ci
          POSTGRES_PASSWORD: isolated_google_ads_m6_ci
          POSTGRES_DB: google_ads_m6_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U google_ads_m6_ci -d google_ads_m6_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: Check M6 preflight and real PostgreSQL 16 schema
        working-directory: backend
        env:
          SECRET_KEY: google-ads-m6-test-only
          JWT_SECRET_KEY: google-ads-m6-jwt-test-only
          GOOGLE_ADS_M6_TEST_POSTGRES_URL: postgresql+psycopg2://google_ads_m6_ci:isolated_google_ads_m6_ci@127.0.0.1:5432/google_ads_m6_ci
        run: |
          timeout --signal=TERM 180s python -m pytest -vv --tb=short -o faulthandler_timeout=30 \
            tests/google_ads/test_google_ads_m6_continuity_schema.py \
            tests/google_ads/test_google_ads_m6_continuity_approval.py \
            tests/google_ads/test_google_ads_m6_authenticated_approval.py \
            tests/google_ads/test_google_ads_m6_authenticated_postgres.py \
            tests/google_ads/test_google_ads_m6_attribution_reader.py \
            tests/google_ads/test_google_ads_m6_daily_pair_preflight.py \
            tests/google_ads/test_google_ads_m6_manual_preview.py \
            tests/google_ads/test_google_ads_m6_manual_confirm.py \
            tests/google_ads/test_google_ads_m6_manual_raw_postgres.py \
            tests/google_ads/test_google_ads_m6_manual_structured_postgres.py \
            tests/google_ads/test_google_ads_m6_attribution_postgres.py \
            tests/google_ads/test_google_ads_m6_continuity_postgres.py \
            tests/google_ads/test_google_ads_m6_daily_publication_postgres.py \
            tests/google_ads/test_google_ads_m6_alembic_merge_graph.py \
            tests/google_ads/test_google_ads_m6_global_publication_reader_postgres.py \
            tests/google_ads/test_google_ads_m6_manual_publication_postgres.py \
            tests/google_ads/test_google_ads_m6_correction_diagnostic_postgres.py \
            tests/google_ads/test_google_ads_m6_correction_candidates_postgres.py \
            tests/google_ads/test_google_ads_m6_daily_branch_reader.py \
            tests/google_ads/test_google_ads_m6_daily_reader_pg_e2e.py \
            tests/marketing/test_google_ads_funnel_investment.py \
            tests/google_ads/test_google_ads_m5_branch_attribution_readonly.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Angular dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Type-check standalone manual upload
        working-directory: frontend
        run: node node_modules/typescript/bin/tsc --noEmit --project tsconfig.app.json
      - name: Build Angular template and styles
        working-directory: frontend
        run: npm run build -- --configuration=production

  frontend-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Angular dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install isolated Playwright runner and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/ga-m6-playwright" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/ga-m6-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Start Angular dev server and run isolated browser QA
        working-directory: frontend
        run: |
          mkdir -p playwright-evidence
          node node_modules/@angular/cli/bin/ng.js serve --host 127.0.0.1 --port 4300 > playwright-evidence/ng-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/ga-m6-playwright/node_modules" node tests/google-ads-m6/browser-qa.cjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-m6-browser-qa
          path: frontend/playwright-evidence/
          if-no-files-found: ignore
          retention-days: 7
