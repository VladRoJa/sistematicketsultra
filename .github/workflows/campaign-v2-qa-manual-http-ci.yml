name: Campaign V2 QA Manual HTTP CI

on:
  pull_request:
    paths:
      - "backend/app/routes/marketing_campaign_v2_routes.py"
      - "backend/app/services/marketing_campaign_v2_qa_http_service.py"
      - "backend/app/services/marketing_campaign_v2_qa_manual_service.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_qa_http.py"
      - "backend/tests/marketing/test_marketing_campaign_v2_qa_manual_service.py"
      - "frontend/src/app/marketing-campaign-v2/**"
      - ".github/workflows/campaign-v2-qa-manual-http-ci.yml"

permissions:
  contents: read

jobs:
  backend-qa-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: synthetic-qa-http
      JWT_SECRET_KEY: synthetic-qa-http-jwt
      CAMPAIGN_V2_PROVIDER_SEND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile and verify authenticated QA Manual HTTP contract
        working-directory: backend
        run: |
          python -m py_compile \
            app/routes/marketing_campaign_v2_routes.py \
            app/services/marketing_campaign_v2_qa_http_service.py \
            app/services/marketing_campaign_v2_qa_manual_service.py
          python -m pytest -q --tb=short \
            tests/marketing/test_marketing_campaign_v2_qa_http.py \
            tests/marketing/test_marketing_campaign_v2_qa_manual_service.py \
            tests/marketing/test_marketing_campaign_v2_routes.py
