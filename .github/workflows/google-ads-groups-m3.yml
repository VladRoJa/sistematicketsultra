name: Google Ads Warehouse Groups M3

on:
  pull_request:
    paths:
      - 'backend/app/models/google_ads_ad_group_daily.py'
      - 'backend/app/models/__init__.py'
      - 'backend/app/warehouse/services/google_ads*'
      - 'backend/migrations/versions/a12b3c4d5e6f_google_ads_ad_group_daily.py'
      - 'backend/tests/google_ads/**'
      - 'frontend/src/app/warehouse/**'
      - '.github/workflows/google-ads-groups-m3.yml'
  push:
    branches:
      - feat/google-ads-ad-group-daily-warehouse-m3-20261012

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5
      - name: Parser, campaign importer and cutoff regressions
        working-directory: backend
        env:
          SECRET_KEY: google-ads-groups-ci
          JWT_SECRET_KEY: google-ads-groups-ci-jwt
        run: |
          python -m pytest -q --tb=short \
            tests/google_ads \
            tests/marketing/test_google_ads_funnel_investment.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: TypeScript compile
        working-directory: frontend
        run: node node_modules/typescript/bin/tsc --noEmit --project tsconfig.app.json
