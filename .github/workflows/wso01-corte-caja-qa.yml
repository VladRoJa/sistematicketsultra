name: WSO-01 Corte de Caja Retirement QA

on:
  pull_request:
    paths:
      - 'backend/app/config.py'
      - 'backend/app/models/warehouse.py'
      - 'backend/app/routes/warehouse_routes.py'
      - 'backend/app/warehouse/**'
      - 'backend/migrations/versions/wso01caja110226_retire_corte_caja.py'
      - 'backend/scripts/ops/wso01_corte_caja_files.py'
      - 'backend/tests/warehouse/test_wso01_corte_caja_*.py'
      - '.github/workflows/wso01-corte-caja-qa.yml'

permissions:
  contents: read

jobs:
  wso01-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wso01_ci
          POSTGRES_USER: wso01_ci
          POSTGRES_PASSWORD: synthetic_wso01_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wso01_ci -d wso01_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      WSO01_TEST_POSTGRES_URL: 'postgresql+psycopg2://wso01_ci:synthetic_wso01_only@127.0.0.1:5432/wso01_ci'
      SECRET_KEY: synthetic-wso01-only
      JWT_SECRET_KEY: synthetic-wso01-only
      SQLALCHEMY_DATABASE_URI: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Compile changed backend modules and migration
        run: |
          python -m py_compile \
            app/warehouse/services/gasca_job_orchestrator.py \
            app/warehouse/services/gasca_script_runner.py \
            app/warehouse/services/gasca_script_bridge.py \
            app/warehouse/services/gasca_extractor_adapter.py \
            app/warehouse/services/gasca_single_report_runner_impl.py \
            app/warehouse/services/warehouse_document_upload_service.py \
            app/routes/warehouse_routes.py \
            migrations/versions/wso01caja110226_retire_corte_caja.py \
            scripts/ops/wso01_corte_caja_files.py \
            tests/warehouse/test_wso01_corte_caja_retired.py \
            tests/warehouse/test_wso01_corte_caja_files.py \
            tests/warehouse/test_wso01_retirement_migration_pg.py
      - name: Run focused retirement and existing Warehouse/Gasca regression tests
        run: |
          python -m pytest -q --tb=short -o addopts= \
            tests/warehouse/test_wso01_corte_caja_retired.py \
            tests/warehouse/test_wso01_corte_caja_files.py \
            tests/warehouse/test_warehouse_upload_snapshot_ids.py \
            tests/warehouse/test_warehouse_upload_retention_route.py \
            tests/warehouse/test_gasca_script_runner.py \
            tests/warehouse/test_gasca_job_orchestrator_venta_total_staging.py
