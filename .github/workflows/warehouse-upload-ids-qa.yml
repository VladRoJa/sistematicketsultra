name: Warehouse Upload IDs QA

on:
  pull_request:
    paths:
      - 'backend/app/routes/warehouse_routes.py'
      - 'backend/tests/warehouse/test_warehouse_upload_snapshot_ids.py'
      - 'frontend/src/app/warehouse/warehouse-home.component.*'
      - 'frontend/src/app/warehouse/services/warehouse-uploads.service.ts'
      - '.github/workflows/warehouse-upload-ids-qa.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Warehouse snapshots and ID search
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SECRET_KEY: synthetic-warehouse-upload-ids
      JWT_SECRET_KEY: synthetic-warehouse-upload-ids
      SQLALCHEMY_DATABASE_URI: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.5
      - name: Check syntax
        run: python -m py_compile app/routes/warehouse_routes.py tests/warehouse/test_warehouse_upload_snapshot_ids.py
      - name: Run Warehouse ID regressions
        run: python -m pytest -q --tb=short -o addopts= tests/warehouse/test_warehouse_upload_snapshot_ids.py tests/warehouse/test_warehouse_upload_retention_route.py

  frontend:
    name: Angular compile and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Compile Angular TypeScript
        run: node node_modules/typescript/bin/tsc --noEmit --project tsconfig.app.json
      - name: Build Angular templates
        run: npm run build -- --configuration production
